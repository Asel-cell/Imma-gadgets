<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shop — IMMA GADGETS</title><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="/style.css"></head><body><header class="p-4"><nav class="glass pill container px-5 py-3 flex justify-between"><a href="/" class="font-black">IMMA GADGETS</a><a href="/cart" class="glass-btn">Cart (<span data-cart-count>0</span>)</a></nav></header><main class="container py-10"><h1 class="text-4xl font-black">Shop</h1><input id="search" class="input mt-7" placeholder="Search phones, laptops, accessories and more"><div class="flex gap-3 overflow-x-auto py-6"><button class="glass-btn" data-cat="all">All</button><button class="glass-btn" data-cat="phones">Phones</button><button class="glass-btn" data-cat="phone accessories">Phone Accessories</button><button class="glass-btn" data-cat="laptops">Laptops</button><button class="glass-btn" data-cat="gadgets">Gadgets</button><button class="glass-btn" data-cat="services">Services</button></div><div id="products" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4"></div></main><script src="/app.js"></script><script>let all=[],cat="all";async function render(){all=all.length?all:await getProducts();const q=document.getElementById("search").value.toLowerCase();const f=all.filter(p=>(cat==="all"||String(p.category).toLowerCase()===cat)&&(String(p.name).toLowerCase().includes(q)||String(p.description||"").toLowerCase().includes(q)||(p.tags||[]).join(" ").toLowerCase().includes(q)));document.getElementById("products").innerHTML=f.length?f.map(productCard).join(""):`<div class="glass rounded-3xl p-12 text-center col-span-full"><div class="text-4xl">📦</div><h2 class="text-xl font-bold mt-4">No products found</h2><p class="muted mt-2">Products added from the admin dashboard will appear here.</p></div>`;bindAddButtons(all)}document.getElementById("search").oninput=render;document.querySelectorAll("[data-cat]").forEach(b=>b.onclick=()=>{cat=b.dataset.cat;render()});render()</script></body></html>
