<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Login — IMMA GADGETS</title><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="/style.css"></head><body><main class="min-h-screen flex items-center justify-center p-5"><form id="login" class="glass rounded-3xl p-8 w-full max-w-md"><h1 class="text-3xl font-black">IMMA GADGETS</h1><p class="muted mt-2">Secure Admin Access</p><input id="password" type="password" autocomplete="current-password" class="input mt-8" placeholder="Private admin password" required><button class="glass-btn primary-btn w-full mt-5">ACCESS DASHBOARD</button><p id="msg" class="status text-center mt-4"></p><a href="/" class="block text-center muted mt-6">← Back to store</a></form></main><script>document.getElementById("login").onsubmit=async e=>{e.preventDefault();const msg=document.getElementById("msg");msg.textContent="Authenticating...";try{const r=await fetch("/.netlify/functions/admin-login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({password:document.getElementById("password").value})});if(r.ok){sessionStorage.setItem("imma_admin","1");location.href="/dashboard"}else msg.textContent="Incorrect password."}catch{msg.textContent="Backend connection failed."}}</script></body></html>
