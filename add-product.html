<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Add Product — IMMA GADGETS</title><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="/style.css"></head><body><header class="p-4"><nav class="glass pill container px-5 py-3 flex justify-between"><a href="/dashboard" class="font-black">IMMA GADGETS</a><a href="/shop" class="glass-btn">Store</a></nav></header><main class="container py-10"><form id="form" class="glass rounded-3xl p-7 max-w-3xl mx-auto"><h1 class="text-3xl font-black">Add Product</h1><p class="muted mt-2">Real product photos only. Maximum image size: 50 MB.</p><div class="grid md:grid-cols-2 gap-4 mt-7"><input id="name" class="input" placeholder="Product name" required><input id="price" class="input" placeholder="Price" inputmode="numeric" required><input id="oldPrice" class="input" placeholder="Old price (optional)" inputmode="numeric"><select id="category" class="input"><option>phones</option><option>phone accessories</option><option>laptops</option><option>laptop chargers</option><option>laptop keyboards</option><option>batteries</option><option>desktops</option><option>monitors</option><option>mouse</option><option>headphones</option><option>earbuds</option><option>smartwatches</option><option>tablets</option><option>gadgets</option><option>services</option></select><input id="stock" class="input" placeholder="Stock quantity" inputmode="numeric" value="1"><input id="tags" class="input" placeholder="Tags, comma separated"></div><textarea id="description" class="input mt-4" rows="5" placeholder="Description"></textarea><label class="drop block mt-4"><span class="block font-semibold">Product image</span><span class="block muted text-sm mt-2">Maximum 50 MB.</span><input id="image" type="file" accept="image/*" class="mt-4" required></label><p id="status" class="status mt-4"></p><button class="glass-btn primary-btn w-full mt-5">PUBLISH PRODUCT</button></form></main><script>if(sessionStorage.getItem("imma_admin")!=="1")location.href="/admin";document.getElementById("form").onsubmit=async e=>{e.preventDefault();const s=document.getElementById("status"),file=document.getElementById("image").files[0];if(!file)return;if(file.size>50*1024*1024){s.textContent="Image exceeds 50 MB.";s.className="status danger mt-4";return}s.textContent="Preparing upload...";try{const up=await fetch("/.netlify/functions/upload-url",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name:file.name,type:file.type,size:file.size})});if(!up.ok)throw Error(await up.text());const info=await up.json();const put=await fetch(info.uploadUrl,{method:"PUT",headers:{"Content-Type":file.type},body:file});if(!put.ok)throw Error("Image upload failed");const product={name:document.getElementById("name").value,price:Number(document.getElementById("price").value.replaceAll(",","")),oldPrice:Number(document.getElementById("oldPrice").value.replaceAll(",",""))||null,category:document.getElementById("category").value,stock:Number(document.getElementById("stock").value)||0,tags:document.getElementById("tags").value.split(",").map(x=>x.trim()).filter(Boolean),description:document.getElementById("description").value,image:info.publicUrl,createdAt:new Date().toISOString()};const save=await fetch("/.netlify/functions/products",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(product)});if(!save.ok)throw Error(await save.text());s.textContent="Product published.";s.className="status success mt-4";e.target.reset()}catch(err){s.textContent=err.message||"Something went wrong.";s.className="status danger mt-4"}}</script></body></html>
