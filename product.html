<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Product — IMMA GADGETS</title><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="/style.css"></head><body><header class="p-4"><nav class="glass pill container px-5 py-3 flex justify-between"><a href="/" class="font-black">IMMA GADGETS</a><a href="/cart" class="glass-btn">Cart (<span data-cart-count>0</span>)</a></nav></header><main id="view" class="container py-10"></main><script src="/app.js"></script><script>(async()=>{const id=new URLSearchParams(location.search).get("id"),ps=await getProducts(),p=ps.find(x=>String(x.id)===String(id)),v=document.getElementById("view");if(!p){v.innerHTML='<div class="glass rounded-3xl p-12 text-center"><h1 class="text-2xl font-bold">Product not found</h1><a class="glass-btn mt-6" href="/shop">Back to shop</a></div>';return}v.innerHTML=`<div class="grid md:grid-cols-2 gap-8"><div class="glass rounded-3xl overflow-hidden"><img src="${esc(p.image||"/imma-logo.png")}" class="w-full aspect-square object-cover"></div><div><p class="text-cyan-300">${esc(p.category||"")}</p><h1 class="text-4xl font-black mt-2">${esc(p.name)}</h1><p class="text-2xl font-bold mt-5">${money(p.salePrice??p.price)}</p><p class="muted mt-6">${esc(p.description||"")}</p><p class="mt-5">${p.stock>0?`In stock: ${p.stock}`:"Contact us for availability"}</p><div class="flex flex-wrap gap-3 mt-8"><button id="cart" class="glass-btn primary-btn">ADD TO CART</button><button id="wa" class="glass-btn">WHATSAPP ORDER</button></div></div></div>`;document.getElementById("cart").onclick=()=>addToCart(p);document.getElementById("wa").onclick=()=>waProduct(p)})()</script></body></html>
