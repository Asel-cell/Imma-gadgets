<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dashboard — IMMA GADGETS</title><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="/style.css"></head><body><header class="p-4"><nav class="glass pill container px-5 py-3 flex justify-between"><a href="/" class="font-black">IMMA GADGETS</a><div class="flex gap-2"><a href="/shop" class="glass-btn">Store</a><button id="logout" class="glass-btn">Logout</button></div></nav></header><main class="container py-10"><div class="flex justify-between items-center gap-4"><div><p class="text-cyan-300 text-sm">ADMIN</p><h1 class="text-4xl font-black">Dashboard</h1></div><a href="/add-product.html" class="glass-btn primary-btn">+ ADD PRODUCT</a></div><div class="glass rounded-3xl p-6 mt-8"><p class="muted">Products</p><p id="count" class="text-4xl font-black mt-2">0</p></div><div id="products" class="grid grid-cols-2 md:grid-cols-4 gap-4 mt-8"></div></main><script src="/app.js"></script><script>if(sessionStorage.getItem("imma_admin")!=="1")location.href="/admin";document.getElementById("logout").onclick=()=>{sessionStorage.removeItem("imma_admin");location.href="/admin"};(async()=>{const p=await getProducts();document.getElementById("count").textContent=p.length;document.getElementById("products").innerHTML=p.map(productCard).join("");bindAddButtons(p)})()</script></body></html>
