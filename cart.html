<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cart — IMMA GADGETS</title><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="/style.css"></head><body><header class="p-4"><nav class="glass pill container px-5 py-3 flex justify-between"><a href="/" class="font-black">IMMA GADGETS</a><a href="/shop" class="glass-btn">Continue Shopping</a></nav></header><main class="container py-10"><h1 class="text-4xl font-black">Your Cart</h1><div id="cart" class="mt-8 space-y-4"></div><div id="summary" class="glass rounded-3xl p-6 mt-8"></div></main><script src="/app.js"></script><script>function draw(){const c=getCart(),el=document.getElementById("cart"),s=document.getElementById("summary");if(!c.length){el.innerHTML='<div class="glass rounded-3xl p-12 text-center"><h2 class="text-xl font-bold">Your cart is empty</h2><a class="glass-btn mt-6" href="/shop">Shop now</a></div>';s.innerHTML="";return}el.innerHTML=c.map(x=>`<div class="glass rounded-3xl p-4 flex gap-4 items-center"><img src="${esc(x.image||"/imma-logo.png")}" class="w-20 h-20 rounded-2xl object-cover"><div class="flex-1"><h3 class="font-bold">${esc(x.name)}</h3><p>${money(x.price)}</p><div class="flex gap-2 mt-3"><button class="glass-btn px-4 py-2" onclick="changeQty('${esc(x.id)}',-1)">−</button><span class="px-3 py-2">${x.quantity}</span><button class="glass-btn px-4 py-2" onclick="changeQty('${esc(x.id)}',1)">+</button></div></div><button class="danger" onclick="removeFromCart('${esc(x.id)}')">Remove</button></div>`).join("");s.innerHTML=`<div class="flex justify-between text-xl font-bold"><span>Total</span><span>${money(cartTotal())}</span></div><div class="flex flex-wrap gap-3 mt-5"><button class="glass-btn primary-btn" onclick="waCart()">ORDER ON WHATSAPP</button><button class="glass-btn" onclick="clearCart()">CLEAR CART</button></div>`}draw()</script></body></html>
